name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: algorank
          POSTGRES_PASSWORD: algorank
          POSTGRES_DB: algorank_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U algorank"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "./ingest[dev]"
      - name: Test
        env:
          ALGORANK_TEST_DATABASE_URL: postgresql://algorank:algorank@127.0.0.1:5432/algorank_test
        run: python -m pytest ingest -q
